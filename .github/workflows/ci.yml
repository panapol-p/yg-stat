name: CI

# ตรวจทุก pull request ก่อนเมิร์จเข้า main
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "รัน gofmt -w . ก่อน"; exit 1; }

      - name: Vet + test
        run: |
          go vet ./...
          go test ./...

      - name: Build (windows)
        run: GOOS=windows GOARCH=amd64 go build -o yg-stat.exe .
